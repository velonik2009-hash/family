name: Напоминания

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  nag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установка
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund
      - name: Отправка напоминаний
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node nag.mjs
      # GitHub отключает расписание, если в репозитории 60 дней не было коммитов.
      # Раз в ~50 дней делаем пустой коммит, чтобы напоминания не остановились.
      - name: Не дать расписанию уснуть
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "reminders-bot"
            git config user.email "reminders-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
